<meta name="theme-color" content="#2563eb">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#f7f9fc; --bg3:#eef2f8; --card:#ffffff;
  --border:#e2e8f0; --border2:#cbd5e1;
  --blue:#2563eb; --blue2:#3b82f6; --blue-dim:#2563eb14;
  --text:#0f172a; --text2:#48566b; --text3:#8695ab;
  --green:#16a34a; --red:#dc2626;
}
body[data-theme="dark"]{
  --bg:#0a0e14; --bg2:#11161f; --bg3:#181f2b; --card:#11161f;
  --border:#232c3d; --border2:#303c52;
  --blue:#3b82f6; --blue2:#60a5fa; --blue-dim:#3b82f61e;
  --text:#f1f5f9; --text2:#b7c3d6; --text3:#69778e;
  --green:#22c55e; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;transition:background .2s,color .2s}
button{cursor:pointer;font-family:'Barlow',sans-serif;border:none;background:none}
input,select,textarea{font-family:'Barlow',sans-serif;outline:none}
::-webkit-scrollbar{width:0;height:0}
select option{background:var(--bg3);color:var(--text)}
#appScroll{height:100%;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.anim{animation:fadeUp .35s cubic-bezier(.16,1,.3,1) forwards}
.anim-1{animation:fadeUp .35s .04s cubic-bezier(.16,1,.3,1) both}
.anim-2{animation:fadeUp .35s .08s cubic-bezier(.16,1,.3,1) both}
.anim-3{animation:fadeUp .35s .12s cubic-bezier(.16,1,.3,1) both}
.anim-4{animation:fadeUp .35s .16s cubic-bezier(.16,1,.3,1) both}
.anim-5{animation:fadeUp .35s .20s cubic-bezier(.16,1,.3,1) both}

.hdr{
  padding:16px 20px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-ico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#1e40af);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;color:#fff}
.brand-name{font-family:'Playfair Display',serif;font-size:1.12rem;font-weight:900;color:var(--text);letter-spacing:.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.5rem;font-weight:700;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-title{display:none}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;transition:all .15s}
.icon-btn:active{transform:scale(.92);border-color:var(--blue)}

#appWrap{max-width:500px;margin:0 auto}
.view{display:none;max-width:500px;margin:0 auto;padding:14px 16px 20px}
.view.active{display:block}

.divider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--text3);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.hero{
  border-radius:20px;padding:22px;margin-bottom:12px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#0f2560 0%,#0a0e14 65%,#0d1a3d 100%);
  border:1px solid #1e3a8a55;
  box-shadow:0 0 0 1px rgba(59,130,246,.12), 0 20px 60px rgba(0,0,0,.4);
}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22) 0%,transparent 70%);}
.hero::after{content:'💳';position:absolute;bottom:-16px;right:14px;font-size:4.6rem;opacity:.06;line-height:1;}
.hero-lbl{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#93c5fd;opacity:.85;margin-bottom:8px;position:relative;z-index:1}
.hero-val{font-family:'DM Mono',monospace;font-size:2.5rem;font-weight:500;color:#fff;letter-spacing:-.02em;line-height:1;position:relative;z-index:1}
.hero-sub{font-size:.78rem;color:#a9bdda;margin-top:6px;position:relative;z-index:1;font-weight:600}
.hero-chips{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1;flex-wrap:wrap}
.hero-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;font-size:.68rem;font-weight:700;color:#e5ecf9}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--blue));opacity:.8}
.stat-icon{font-size:1.3rem;margin-bottom:8px}
.stat-lbl{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.stat-val{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);line-height:1}
.stat-sub{font-size:.72rem;color:var(--text2);margin-top:3px;font-weight:600}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.chart-lbl{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* ══════════════════════════════════════════════════════════
   LAYOUT PARA TELAS GRANDES (notebook / desktop)
   Só entra em ação acima de 900px. No celular nada muda.

@media (min-width:900px){

  .hero{padding:28px 30px}

  /* interação com mouse */
  .item-row,.launch-row,.stock-row{transition:border-color .15s,box-shadow .15s,transform .15s}

  /* modal vira caixa centralizada em vez de gaveta inferior */
  #ov{align-items:center}
  #mbox{max-width:520px;border-radius:20px;max-height:86vh;animation:fadeUp .22s cubic-bezier(.16,1,.3,1)}
  .mhandle{display:none}

  /* toque -> clique: alvos podem ser um pouco menores e o texto respira */
  .inp,.btn-main,.btn-ghost{cursor:pointer}

  /* cabeçalho: marca só na lateral, título da tela no topo */

}

@media (min-width:1400px){
  #appWrap,.view{max-width:1200px}
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONEXÃO COM A NUVEM (Supabase)
// ═══════════════════════════════════════════════════════════════
const SB_URL='https://lsjrnsydqpcipbhflrvl.supabase.co';
const SB_KEY='sb_publishable_L2kpMeTuJ5cnK7U-VFEgTw_M71FuI59';
const sb=supabase.createClient(SB_URL,SB_KEY);

// utilitário de formatação de números com zero à esquerda (usado em datas)
function pad(n){return String(n).padStart(2,'0');}

// formas de pagamento aceitas
const FORMAS=[
  {id:'dinheiro',name:'Dinheiro',emoji:'💵'},
  {id:'pix',name:'Pix',emoji:'📲'},
  {id:'cartao',name:'Cartão',emoji:'💳'},
  {id:'fiado',name:'Fiado',emoji:'📒'},
];

// Estado em memória (espelha o que está na nuvem para o negócio logado)
let S={categorias:[],clientes:[],lancamentos:[],pagamentos:[],theme:'light'};
let NEGOCIO_ID=null;
let NEGOCIO_NOME='';
let USER_ID=null;
let USER_EMAIL='';
let _gravando=0;let _resyncEmCurso=false;let _writeGen=0;

// Tema é a única coisa que fica no aparelho (preferência visual, não é dado do negócio)
try{const t=localStorage.getItem('fc-theme');if(t==='light'||t==='dark')S.theme=t;}catch(e){}

// ── Mapeadores: banco (snake_case) <-> app (camelCase) ──
function rowToCategoria(r){return{id:r.id,name:r.nome,type:r.tipo,emoji:r.emoji,color:r.cor,preco:(typeof r.preco==='number'?r.preco:0),controlaEstoque:!!r.controla_estoque,estoqueQtd:r.estoque_qtd||0,estoqueMin:r.estoque_min||0};}
function categoriaToRow(c){return{id:c.id,negocio_id:NEGOCIO_ID,nome:c.name,tipo:c.type,emoji:c.emoji||null,cor:c.color||null,preco:(typeof c.preco==='number'?c.preco:0),controla_estoque:!!c.controlaEstoque,estoque_qtd:c.estoqueQtd||0,estoque_min:c.estoqueMin||0};}

function rowToCliente(r){return{id:r.id,name:r.nome,telefone:r.telefone||'',createdAt:r.criado_em?r.criado_em.slice(0,10):todayStr()};}
function clienteToRow(c){return{id:c.id,negocio_id:NEGOCIO_ID,nome:c.name,telefone:c.telefone||null};}

function rowToLanc(r){const l={id:r.id,type:r.tipo,categoriaId:r.categoria_id,valor:Number(r.valor),forma:r.forma,date:r.data,hora:r.hora,obs:r.obs||'',grupoId:r.grupo_id||undefined};
  if(r.cliente_id)l.clienteId=r.cliente_id;
  if(r.qtd!=null)l.qtd=r.qtd;
  if(r.preco_unit!=null)l.precoUnit=Number(r.preco_unit);
  if(r.ref_categoria_id)l.refCategoriaId=r.ref_categoria_id;
  if(r.qtd_comprada!=null)l.qtdComprada=r.qtd_comprada;

// ── Camada de acesso à nuvem ──
const db={
  async negocioDoUsuario(){
    const v=await sb.from('usuarios_negocio').select('negocio_id').limit(1);
    if(v.error)throw v.error;
    if(!v.data||!v.data.length)return null;
    const nid=v.data[0].negocio_id;
    const n=await sb.from('negocios').select('nome').eq('id',nid).maybeSingle();
    if(n.error)throw n.error;
    return{id:nid,nome:(n.data&&n.data.nome)||'Meu negócio'};
  },
  async _buscarTudo(){
    const [cat,cli,lan,pag]=await Promise.all([
      sb.from('categorias').select('*').eq('negocio_id',NEGOCIO_ID),
      sb.from('clientes').select('*').eq('negocio_id',NEGOCIO_ID),
      sb.from('lancamentos').select('*').eq('negocio_id',NEGOCIO_ID),
      sb.from('pagamentos').select('*').eq('negocio_id',NEGOCIO_ID)
    ]);
    for(const r of [cat,cli,lan,pag]) if(r.error) throw r.error;
    return {
      categorias:cat.data.map(rowToCategoria),
      clientes:cli.data.map(rowToCliente),
      lancamentos:lan.data.map(rowToLanc),
      pagamentos:pag.data.map(rowToPagamento)
    };
  },
  _aplicar(dados){
    S.categorias=dados.categorias;
    S.clientes=dados.clientes;
    S.lancamentos=dados.lancamentos;
    S.pagamentos=dados.pagamentos;
  },
  // recarga incondicional (usada logo após uma escrita — sempre aplica)
  async carregarTudo(){
    this._aplicar(await this._buscarTudo());
  },
  // recarga de segundo plano: só aplica se nenhuma escrita nova aconteceu no meio
  async carregarTudoInterno(gen){
    const dados=await this._buscarTudo();
    if(gen===_writeGen) this._aplicar(dados);
    // se _writeGen mudou, uma escrita mais recente venceu — descarta este resultado
  },
  async inserirLancamento(l){const {error}=await sb.from('lancamentos').insert(lancToRow(l));if(error)throw error;},
  async excluirLancamento(id){const {error}=await sb.from('lancamentos').delete().eq('id',id);if(error)throw error;},
  async desvincularCliente(lancId){const {error}=await sb.from('lancamentos').update({cliente_id:null}).eq('id',lancId);if(error)throw error;},
  async inserirPagamento(p){const {error}=await sb.from('pagamentos').insert(pagamentoToRow(p));if(error)throw error;},
  async excluirPagamento(id){const {error}=await sb.from('pagamentos').delete().eq('id',id);if(error)throw error;},
  async inserirCliente(c){const {error}=await sb.from('clientes').insert(clienteToRow(c));if(error)throw error;},
  async atualizarCliente(c){const {error}=await sb.from('clientes').update(clienteToRow(c)).eq('id',c.id);if(error)throw error;},
  async excluirCliente(id){const {error}=await sb.from('clientes').delete().eq('id',id);if(error)throw error;},
  async inserirCategoria(c){const {error}=await sb.from('categorias').insert(categoriaToRow(c));if(error)throw error;},
  async atualizarCategoria(c){const {error}=await sb.from('categorias').update(categoriaToRow(c)).eq('id',c.id);if(error)throw error;},
  async excluirCategoria(id){const {error}=await sb.from('categorias').delete().eq('id',id);if(error)throw error;}
};

// Envolve as escritas do db para sinalizar "gravação em curso" (evita corrida com resync)
(function(){
  const metodosDeEscrita=['inserirLancamento','excluirLancamento','desvincularCliente','inserirPagamento','excluirPagamento','inserirCliente','atualizarCliente','excluirCliente','inserirCategoria','atualizarCategoria','excluirCategoria'];
  metodosDeEscrita.forEach(function(nome){
    const orig=db[nome];
    db[nome]=async function(){
      _gravando++;_writeGen++;
      try{return await orig.apply(db,arguments);}
      finally{_gravando--;_writeGen++;}
    };
  });
})();

async function ressincronizar(){

  if(_resyncEmCurso)return;   // já tem uma recarga rodando

var TEM_MOUSE=(typeof window!=='undefined'&&window.matchMedia)?window.matchMedia('(pointer:fine)').matches:false;
var ACAO=TEM_MOUSE?'Clique':'Toque';
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function esc(s){return (s===undefined||s===null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function normalizeTxt(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function levenshtein(a,b){
  const m=a.length,n=b.length;if(m===0)return n;if(n===0)return m;
  let prev=[];for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){const cost=a[i-1]===b[j-1]?0:1;cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);}prev=cur;}
  return prev[n];
}
function fuzzyScore(query,target){
  const q=normalizeTxt(query),t=normalizeTxt(target);
  if(!q)return 0;if(t.includes(q))return 0;
  let best=Infinity;
  t.split(/\s+/).forEach(w=>{
    if(!w)return;
    if(w.includes(q)){best=Math.min(best,0.5);return;}
    const d=levenshtein(q,w),th=Math.max(1,Math.floor(Math.max(q.length,w.length)*0.34));
    if(d<=th)best=Math.min(best,1+d);
  });
  const dFull=levenshtein(q,t),thFull=Math.max(1,Math.floor(Math.max(q.length,t.length)*0.34));
  if(dFull<=thFull)best=Math.min(best,1+dFull);
  return best;
}

function isFiado(l){return l.forma==='fiado';}

// ── MODELO FINANCEIRO ──────────────────────────────────────────
// Uma venda no fiado é FATURAMENTO no dia da venda, mas só vira DINHEIRO EM CAIXA
// no dia em que o cliente paga. Por isso os pagamentos ficam separados (S.pagamentos),
// o que também permite quitação parcial (pagar só uma parte da dívida).

// Recebido em caixa numa lista de lançamentos (vendas à vista do período)
function entradasPagas(list){return list.filter(l=>l.type==='entrada'&&!isFiado(l)).reduce((s,l)=>s+l.valor,0);}
// Vendido no fiado no período (ainda não necessariamente recebido)
function entradasFiado(list){return list.filter(l=>l.type==='entrada'&&isFiado(l)).reduce((s,l)=>s+l.valor,0);}
// Faturamento do período = tudo que foi vendido (à vista + fiado)
function entradasTotal(list){return list.filter(l=>l.type==='entrada').reduce((s,l)=>s+l.valor,0);}

function pagamentosDoDia(date){return S.pagamentos.filter(p=>p.date===date);}
function pagamentosDoMes(y,m){
  return S.pagamentos.filter(p=>{const d=new Date(p.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m;});
}
function somaPagamentos(list){return list.reduce((s,p)=>s+p.valor,0);}

// Fiado total lançado no nome do cliente (histórico completo)
function fiadoTotalCliente(clienteId){
  return S.lancamentos.filter(l=>isFiado(l)&&l.clienteId===clienteId).reduce((s,l)=>s+l.valor,0);
}
// Quanto o cliente já pagou de fiado
function fiadoPagoDoCliente(clienteId){
  return S.pagamentos.filter(p=>p.clienteId===clienteId).reduce((s,p)=>s+p.valor,0);
}
// Saldo devedor atual = fiado lançado - pagamentos (nunca negativo)
function fiadoDoCliente(clienteId){
  return Math.max(0,fiadoTotalCliente(clienteId)-fiadoPagoDoCliente(clienteId));
}
function fiadoAbertoTotal(){
  return S.clientes.reduce((s,c)=>s+fiadoDoCliente(c.id),0);
}
// Itens de fiado do cliente, com quanto ainda falta pagar em cada um (mais antigo primeiro)
function fiadoItensCliente(clienteId){
  const itens=S.lancamentos.filter(l=>isFiado(l)&&l.clienteId===clienteId)
    .sort((a,b)=>(a.date+a.hora).localeCompare(b.date+b.hora));
  let credito=fiadoPagoDoCliente(clienteId);
  return itens.map(l=>{
    const abatido=Math.min(credito,l.valor);
    credito-=abatido;
    return{lanc:l,restante:l.valor-abatido,quitado:(l.valor-abatido)<0.005};
  });
}

// Total já gasto pelo cliente na adega (todas as compras em nome dele)
function totalGastoCliente(clienteId){
  return S.lancamentos.filter(l=>l.type==='entrada'&&l.clienteId===clienteId).reduce((s,l)=>s+l.valor,0);
}
function ultimaCompraCliente(clienteId){
  const datas=S.lancamentos.filter(l=>l.type==='entrada'&&l.clienteId===clienteId).map(l=>l.date).sort();
  return datas.length?datas[datas.length-1]:null;
}
function diasSemVir(clienteId){
  const ult=ultimaCompraCliente(clienteId);
  if(!ult)return null;
  const d1=new Date(ult+'T00:00:00'),d2=new Date(todayStr()+'T00:00:00');
  return Math.round((d2-d1)/86400000);

// Uma "visita" = um atendimento. Itens lançados juntos contam como 1 cliente atendido.
// Clientes SEM cadastro também contam: cada lançamento avulso é um atendimento próprio.
function visitKey(l){
  // Cliente identificado: tudo que ele comprou no mesmo dia é UM atendimento.
  if(l.clienteId)return 'c:'+l.clienteId+'|'+l.date;
  // Sem cliente: itens lançados juntos (mesmo grupo) contam como um só.
  if(l.grupoId)return 'g:'+l.grupoId;
  return 'solo:'+l.id;
}
function contaClientes(list){
  return new Set(list.filter(l=>l.type==='entrada').map(visitKey)).size;
}
function estoqueBaixoList(){
  return S.categorias.filter(c=>c.type==='entrada'&&(c.estoqueMin||0)>0&&(c.estoqueQtd||0)<=c.estoqueMin);
}

function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function lancsDoMes(y,m){
  return S.lancamentos.filter(l=>{
    const d=new Date(l.date+'T00:00:00');
    return d.getFullYear()===y&&d.getMonth()===m;
  });
}
function monthTotalsFor(y,m){
  const list=lancsDoMes(y,m);
  const ent=entradasTotal(list);                       // faturamento do mês (à vista + fiado)
  const vendaVista=entradasPagas(list);                // vendas pagas na hora
  const entFiado=entradasFiado(list);                  // vendas no fiado
  const recFiado=somaPagamentos(pagamentosDoMes(y,m)); // fiados recebidos neste mês
  const entPagas=vendaVista+recFiado;                  // total que entrou no caixa
  const sai=totalSaidas(list);
  return{ent,entPagas,vendaVista,recFiado,entFiado,sai,saldo:ent-sai,saldoCaixa:entPagas-sai,clientes:contaClientes(list)};
}
function buildHist(){
  const h={};
  S.lancamentos.forEach(l=>{
    const d=new Date(l.date+'T00:00:00');
    const k=d.getFullYear()+'-'+pad(d.getMonth());
    if(!h[k])h[k]={ent:0,vendaVista:0,entFiado:0,recFiado:0,sai:0,key:k,y:d.getFullYear(),m:d.getMonth(),_visitas:new Set()};
    if(l.type==='entrada'){
      h[k].ent+=l.valor;
      if(isFiado(l))h[k].entFiado+=l.valor;else h[k].vendaVista+=l.valor;
      h[k]._visitas.add(visitKey(l));
    }else h[k].sai+=l.valor;
  });
  // pagamentos de fiado entram como recebimento no mês em que foram pagos
  S.pagamentos.forEach(p=>{
    const d=new Date(p.date+'T00:00:00');
    const k=d.getFullYear()+'-'+pad(d.getMonth());
    if(!h[k])h[k]={ent:0,vendaVista:0,entFiado:0,recFiado:0,sai:0,key:k,y:d.getFullYear(),m:d.getMonth(),_visitas:new Set()};
    h[k].recFiado+=p.valor;
  });
  return Object.values(h).map(v=>{
    v.clientes=v._visitas.size;delete v._visitas;
    v.entPagas=v.vendaVista+v.recFiado;
    return v;
  }).sort((a,b)=>b.key.localeCompare(a.key));
}
// Previsão de faturamento do mês.
// Base de cálculo = FATURAMENTO TOTAL (vendas pagas + fiado), porque uma venda fiada
// também é receita do mês, só ainda não foi recebida.
// Fórmula: projeção pelo ritmo diário do mês atual, ponderada com a média dos meses fechados.
// O peso do ritmo atual cresce conforme o mês avança (no fim do mês vale ~100%).
function forecastMes(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const diasNoMes=daysInMonth(y,m),diasDecorridos=now.getDate();
  const atual=monthTotalsFor(y,m);

  const ritmoDiario=atual.ent/diasDecorridos;      // média por dia até agora
  const projAtual=ritmoDiario*diasNoMes;           // projeção do mês inteiro nesse ritmo

  const mesesFechados=buildHist().filter(h=>!(h.y===y&&h.m===m)).slice(0,3);
  let base=null;
  if(mesesFechados.length>0){
    let s=0;mesesFechados.forEach(h=>{s+=h.ent;});
    base=s/mesesFechados.length;                   // média de faturamento dos meses anteriores
  }

  let previsao,confiavel=true,msg=null;
  if(base===null){
    if(diasDecorridos<3){
      confiavel=false;
      msg='Faltam poucos dias de uso para eu aprender o ritmo do negócio e calcular uma previsão confiável.';
      previsao=atual.ent;
    }else previsao=projAtual;
  }else{
    const peso=Math.min(1,diasDecorridos/diasNoMes);
    previsao=peso*projAtual+(1-peso)*base;
  }
  return{
    previsao,diasDecorridos,diasNoMes,temHistorico:base!==null,confiavel,msg,
    realizado:atual.ent,realizadoPago:atual.entPagas,realizadoFiado:atual.entFiado
  };
}

function passoQtdCarrinho(n,preco){
  const el=document.getElementById('cq');if(!el)return;
  el.value=Math.max(1,(parseInt(el.value)||1)+n);
  recalcCarrinho(preco);
}
function recalcCarrinho(preco){
  const qEl=document.getElementById('cq'),vEl=document.getElementById('cv'),hint=document.getElementById('cHint');
  if(!qEl||!vEl)return;
  const qtd=parseInt(qEl.value)||0;
  if(preco>0&&!window._valorManual){
    const total=qtd*preco;
    vEl.value=total.toFixed(2);
    if(hint)hint.textContent=qtd+' × '+fmt(preco)+' = '+fmt(total);
  }else if(hint&&preco>0){
    hint.textContent='Preço de tabela: '+qtd+' × '+fmt(preco)+' = '+fmt(qtd*preco)+' (valor alterado à mão)';
  }
}
function doAddCarrinho(categoriaId){
  const qtd=parseInt(document.getElementById('cq').value)||0;
  const valor=parseFloat(document.getElementById('cv').value)||0;
  if(qtd<=0){toast('Quantidade precisa ser pelo menos 1',true);return;}
  if(valor<=0){toast('Digite um valor válido',true);return;}
  const existente=CARRINHO.find(function(i){return i.categoriaId===categoriaId;});
  if(existente){existente.qtd+=qtd;existente.valor+=valor;}
  else CARRINHO.push({categoriaId,qtd,valor});
  closeModal();renderLancar();
  toast(catInfo(categoriaId).name+' na venda');
}

function selFormaVenda(id){
  FORMAS.forEach(function(f){const el=document.getElementById('fm-'+f.id);if(el)el.classList.toggle('sel',f.id===id);});
  window._forma=id;
  const box=document.getElementById('fiadoClienteBox');
  const vbox=document.getElementById('vendaClienteBox');
  if(id==='fiado'){
    if(vbox)vbox.style.display='none';
    if(box)box.innerHTML=fiadoClienteHtml();
  }else{
    if(vbox)vbox.style.display='block';
    if(box)box.innerHTML='';
    window._fiadoCliente=null;
  }
}
async function doFinalizarVenda(){
  if(!CARRINHO.length)return;
  const forma=window._forma||'dinheiro';
  if(forma==='fiado'&&!window._fiadoCliente){toast('Selecione o cliente do fiado',true);return;}
  const hora=document.getElementById('lh').value||'00:00';
  const dEl=document.getElementById('ld');
  const data=(dEl&&/^\d{4}-\d{2}-\d{2}$/.test(dEl.value))?dEl.value:todayStr();

  let clienteId=null;
  if(forma==='fiado')clienteId=window._fiadoCliente;
  else{
    const inp=document.getElementById('lcli');
    const nome=inp?inp.value.trim():'';
    clienteId=window._vendaCliente||(await garanteCliente(nome));
  }

  const grupoId=novoId();          // um grupo = um atendimento
  const itens=CARRINHO.slice();
  const total=carrinhoTotal();
  const mexidas=[],avisos=[];
  const gravados=[];

  try{
    setSyncBadge('busy');
    for(const it of itens){
      const cat=S.categorias.find(c=>c.id===it.categoriaId);
      const lanc={id:novoId(),type:'entrada',categoriaId:it.categoriaId,valor:it.valor,forma,hora,date:data,
        obs:'',grupoId,qtd:it.qtd,precoUnit:it.qtd>0?it.valor/it.qtd:it.valor};
      if(clienteId)lanc.clienteId=clienteId;
      await db.inserirLancamento(lanc);
      gravados.push(it);
      if(cat){
        if(it.qtd>(cat.estoqueQtd||0))avisos.push(cat.name);
        cat.estoqueQtd=Math.max(0,(cat.estoqueQtd||0)-it.qtd);
        mexidas.push(cat);
      }
    }
    for(const cat of mexidas)await db.atualizarCategoria(cat);
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){
    setSyncBadge('err');
    // mantém no carrinho só o que não foi gravado
    CARRINHO=itens.filter(function(it){return gravados.indexOf(it)===-1;});
    await recarregarSilencioso().catch(function(){});
    closeModal();renderLancar();
    toast(gravados.length?'Parte da venda não foi salva. Tente de novo.':'Erro ao salvar. Verifique a internet.',true);
    return;
  }

  CARRINHO=[];
  closeModal();
  refreshAll();
  toast(avisos.length?('Venda registrada · confira o estoque de '+avisos[0]):('Venda de '+fmt(total)+' registrada!'));
}

async function criarCategoriasIniciais(){
  const existentes=S.categorias.map(c=>normalizeTxt(c.name));
  const novas=CATS_INICIAIS.filter(c=>existentes.indexOf(normalizeTxt(c.name))===-1);
  if(!novas.length){toast('Já está tudo cadastrado');return;}
  try{
    setSyncBadge('busy');
    for(const c of novas){
      await db.inserirCategoria({id:novoId(),name:c.name,type:c.type,emoji:c.emoji,color:c.color,preco:c.preco,controlaEstoque:c.type==='entrada',estoqueQtd:0,estoqueMin:c.estoqueMin});
    }
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){setSyncBadge('err');toast('Erro ao criar a lista',true);return;}
  renderLancar();
  toast(novas.length+' itens criados!');
}

// Recalcula o total quando muda a quantidade (só se o usuário ainda não digitou um valor próprio)
function recalcVenda(preco){
  const qEl=document.getElementById('lq'),vEl=document.getElementById('lv'),hint=document.getElementById('calcHint');
  if(!qEl||!vEl)return;
  const qtd=parseInt(qEl.value)||0;
  if(preco>0&&!window._valorManual){
    const total=qtd*preco;
    vEl.value=total.toFixed(2);
    if(hint)hint.textContent=qtd+' × '+fmt(preco)+' = '+fmt(total);
  }else if(hint&&preco>0){
    hint.textContent='Preço de tabela: '+qtd+' × '+fmt(preco)+' = '+fmt(qtd*preco)+' (valor alterado manualmente)';
  }
}
// Quando o usuário edita o valor na mão, paramos de sobrescrever

// Autocomplete de cliente na venda
function sugereCliente(){
  const inp=document.getElementById('lcli');const box=document.getElementById('cliSug');
  if(!inp||!box)return;
  const q=inp.value.trim();
  window._vendaCliente=null;
  if(q===''){box.innerHTML='';return;}
  const achados=S.clientes.map(c=>({c,score:fuzzyScore(q,c.name)})).filter(x=>x.score!==Infinity)
    .sort((a,b)=>a.score-b.score).slice(0,4);
  const exato=S.clientes.find(c=>normalizeTxt(c.name)===normalizeTxt(q));
  if(exato)window._vendaCliente=exato.id;
  box.innerHTML=achados.length===0?`<div style="font-size:.7rem;color:var(--text3);font-weight:600;padding:4px 2px">Novo cliente "${esc(q)}" será cadastrado</div>`:
    achados.map(({c})=>`<div class="cli-opt" onclick="pickVendaCliente('${c.id}')">
      <div class="cli-avatar" style="width:26px;height:26px;font-size:.72rem">${esc(c.name.charAt(0).toUpperCase())}</div>
      <div style="font-weight:700;font-size:.8rem">${esc(c.name)}</div>
    </div>`).join('');
}
function pickVendaCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  window._vendaCliente=id;
  const inp=document.getElementById('lcli');if(inp)inp.value=c.name;
  const box=document.getElementById('cliSug');
  if(box)box.innerHTML=`<div style="font-size:.72rem;color:var(--blue);font-weight:700;padding:4px 2px">✓ ${esc(c.name)}</div>`;
}

  opts.forEach(o=>{o.style.display=fuzzyScore(q,o.dataset.fullname)!==Infinity?'flex':'none';});
}

// Garante um cliente pelo nome digitado (cria se ainda não existir).
// Retorna o id; se criar um novo, grava na nuvem.
async function garanteCliente(nome){
  const n=(nome||'').trim();
  if(!n)return null;
  const existente=S.clientes.find(c=>normalizeTxt(c.name)===normalizeTxt(n));
  if(existente)return existente.id;
  const c={id:novoId(),name:n,telefone:'',createdAt:todayStr()};
  await db.inserirCliente(c);
  S.clientes.push(c);
  return c.id;
}

async function doLanc(categoriaId,type){
  const valor=parseFloat(document.getElementById('lv').value)||0;
  if(valor<=0){toast('Digite um valor válido',true);return;}
  const forma=window._forma||'dinheiro';
  if(forma==='fiado'&&!window._fiadoCliente){toast('Selecione o cliente do fiado',true);return;}
  const hora=document.getElementById('lh').value||'00:00';
  const obsEl=document.getElementById('lo');
  const obs=obsEl?(obsEl.value||'').trim():'';
  const cat=catInfo(categoriaId);
  let qtd=null;
  if(type==='entrada'){
    const qEl=document.getElementById('lq');
    qtd=qEl?(parseInt(qEl.value)||0):null;
    if(qtd!==null&&qtd<=0){toast('Quantidade precisa ser pelo menos 1',true);return;}
    if(qtd!==null&&cat.type==='entrada'){
      if(qtd>(cat.estoqueQtd||0))window._avisoEstoque=cat.name;   // vendeu mais do que estava contado
      cat.estoqueQtd=Math.max(0,(cat.estoqueQtd||0)-qtd);
    }
  }
  const id=novoId();
  // grupoId identifica um atendimento: itens lançados juntos = 1 cliente, não vários
  const grupoId=novoId();
  const dEl=document.getElementById('ld');
  const data=(dEl&&/^\d{4}-\d{2}-\d{2}$/.test(dEl.value))?dEl.value:todayStr();
  const lanc={id,type,categoriaId,valor,forma,hora,date:data,obs,grupoId};
  if(qtd!==null){
    lanc.qtd=qtd;
    lanc.precoUnit=qtd>0?valor/qtd:valor;   // preço unitário efetivo desta venda
  }
  if(forma==='fiado'){
    lanc.clienteId=window._fiadoCliente;
  }else if(type==='entrada'){
    const inp=document.getElementById('lcli');
    const nome=inp?inp.value.trim():'';
    const cid=window._vendaCliente||(await garanteCliente(nome));
    if(cid)lanc.clienteId=cid;
  }
  try{
    setSyncBadge('busy');
    await db.inserirLancamento(lanc);
    // se a venda mexeu no estoque, persiste a nova quantidade da categoria
    if(qtd!==null&&cat.type==='entrada')await db.atualizarCategoria(cat);
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){
    setSyncBadge('err');
    // desfaz o desconto de estoque em memória, já que não gravou
    if(qtd!==null&&cat.type==='entrada')cat.estoqueQtd=(cat.estoqueQtd||0)+qtd;
    toast('Erro ao salvar. Verifique a internet.',true);
    return;
  }
  closeModal();
  if(window._avisoEstoque){
    const nome=window._avisoEstoque;window._avisoEstoque=null;
    toast('Venda lançada · confira o estoque de '+nome);
  }else toast((type==='entrada'?'Venda lançada! ':'Gasto lançado! ')+fmt(valor));
  refreshAll();
}

    </div>

    </p>
    <button class="btn-danger" onclick="delLanc('${id}')">Apagar lançamento</button>
    <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
  `);

// Quanto de pagamento sobraria sem cobertura se este fiado fosse apagado
function pagamentosSobrando(l){
  if(!l||!isFiado(l)||!l.clienteId)return 0;
  const restaFiado=fiadoTotalCliente(l.clienteId)-l.valor;
  const pago=fiadoPagoDoCliente(l.clienteId);
  return Math.max(0,pago-restaFiado);
}
async function delLanc(id){
  const l=S.lancamentos.find(x=>x.id===id);
  let catMexida=null,delta=0;
  if(l){
    if(l.type==='entrada'&&l.qtd){
      const cat=S.categorias.find(c=>c.id===l.categoriaId);
      if(cat&&cat.type==='entrada'){cat.estoqueQtd=(cat.estoqueQtd||0)+l.qtd;catMexida=cat;delta=-l.qtd;}
    }
    if(l.type==='saida'&&l.qtdComprada&&l.refCategoriaId){
      const prod=S.categorias.find(c=>c.id===l.refCategoriaId);
      if(prod&&prod.type==='entrada'){prod.estoqueQtd=Math.max(0,(prod.estoqueQtd||0)-l.qtdComprada);catMexida=prod;delta=l.qtdComprada;}
    }
  }
  // Se era um fiado já pago, os pagamentos que ficariam sem dívida são desfeitos
  let sobra=pagamentosSobrando(l);
  const pagsAjustar=[];
  if(sobra>0.005&&l&&l.clienteId){
    const pags=S.pagamentos.filter(p=>p.clienteId===l.clienteId)
      .sort((a,b)=>(b.date+b.hora).localeCompare(a.date+a.hora));   // do mais recente pro mais antigo
    let falta=sobra;
    for(const p of pags){
      if(falta<=0.005)break;
      if(p.valor<=falta+0.005){pagsAjustar.push({p,acao:'del'});falta-=p.valor;}
      else{pagsAjustar.push({p,acao:'reduz',novo:p.valor-falta});falta=0;}
    }
  }
  try{
    setSyncBadge('busy');
    await db.excluirLancamento(id);
    if(catMexida)await db.atualizarCategoria(catMexida);
    for(const a of pagsAjustar){
      if(a.acao==='del')await db.excluirPagamento(a.p.id);
      else{await db.excluirPagamento(a.p.id);await db.inserirPagamento({id:novoId(),clienteId:a.p.clienteId,valor:a.novo,forma:a.p.forma,date:a.p.date,hora:a.p.hora});}
    }
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){
    setSyncBadge('err');
    if(catMexida)catMexida.estoqueQtd+=delta;  // desfaz o ajuste em memória
    await recarregarSilencioso().catch(function(){});
    toast('Erro ao remover. Verifique a internet.',true);
    return;
  }
  closeModal();
  toast(sobra>0.005?('Removido · '+fmt(sobra)+' de pagamento desfeito'):'Removido');
  refreshAll();
}

function clientStats(c){
  const gasto=totalGastoCliente(c.id);
  const deve=fiadoDoCliente(c.id);
  const dias=diasSemVir(c.id);
  const compras=new Set(S.lancamentos.filter(l=>l.type==='entrada'&&l.clienteId===c.id).map(visitKey)).size;
  return{gasto,deve,dias,compras,isVIP:gasto>=500,isSumido:dias!==null&&dias>=30};
}

  <div class="anim">

function filterClientesView(){
  const el=document.getElementById('cliSearch');if(!el)return;
  const q=el.value;
  const container=document.getElementById('clientesGrid');
  const noRes=document.getElementById('clientesNoResults');
  const cards=Array.from(container.querySelectorAll('.cliente-card'));
  if(q.trim()===''){cards.forEach(c=>c.style.display='block');if(noRes)noRes.style.display='none';return;}
  const scored=cards.map(c=>({el:c,score:fuzzyScore(q,c.dataset.fullname)})).filter(x=>x.score!==Infinity).sort((a,b)=>a.score-b.score);
  cards.forEach(c=>c.style.display='none');
  scored.forEach(x=>{x.el.style.display='block';container.insertBefore(x.el,noRes||null);});
  if(noRes)noRes.style.display=scored.length===0?'block':'none';
}

function findSimilarClient(name,excludeId){
  const n=normalizeTxt(name);
  let best=null,bestD=Infinity;
  S.clientes.forEach(c=>{
    if(excludeId&&c.id===excludeId)return;
    const cn=normalizeTxt(c.name);
    if(!cn)return;
    const d=levenshtein(n,cn),th=Math.max(1,Math.floor(Math.max(n.length,cn.length)*0.3));
    if(d<=th&&d<bestD){bestD=d;best=c;}
  });
  return best;
}

function deleteCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  const deve=fiadoDoCliente(id);
  if(deve>0){toast('Cliente tem fiado em aberto — quite antes de excluir',true);return;}
  const compras=S.lancamentos.filter(l=>l.clienteId===id).length;
  const pags=S.pagamentos.filter(p=>p.clienteId===id).length;
  openModal(`
    <div class="mtitle" style="color:var(--red)">🗑️ Excluir ${esc(c.name)}</div>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:18px;line-height:1.5">
      ${compras>0
        ? `${compras>1?`As <b>${compras}</b> compras dele continuam`:'A compra dele continua'} no histórico e no faturamento — ${compras>1?'só deixam':'só deixa'} de ficar no nome dele. O cadastro é apagado e não dá pra desfazer.`
        : 'Este cliente não tem nenhuma compra registrada. O cadastro será apagado.'}
    </p>
    <button class="btn-danger" onclick="doDeleteCliente('${id}')">Excluir cliente</button>
    <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
  `);
}
async function doDeleteCliente(id){
  const deve=fiadoDoCliente(id);
  if(deve>0){toast('Cliente tem fiado em aberto — quite antes de excluir',true);return;}
  const vinculados=S.lancamentos.filter(l=>l.clienteId===id);
  const pags=S.pagamentos.filter(p=>p.clienteId===id);
  try{
    setSyncBadge('busy');
    // solta os lançamentos do nome dele (o histórico e o faturamento ficam intactos)
    for(const l of vinculados)await db.desvincularCliente(l.id);
    // pagamentos de fiado pertencem ao cliente; sem ele, deixam de fazer sentido
    for(const p of pags)await db.excluirPagamento(p.id);
    await db.excluirCliente(id);
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){
    setSyncBadge('err');
    await recarregarSilencioso().catch(function(){});
    toast('Não foi possível excluir. Tente de novo.',true);
    return;
  }
  closeModal();renderClientes();toast('Cliente excluído');
}

// Produto "removido" com histórico é arquivado (estoqueMin -1), nunca apagado do banco,
// para não quebrar os lançamentos antigos que apontam para ele.
function ehArquivado(c){return c&&c.estoqueMin===-1;}
function produtos(){return S.categorias.filter(c=>c.type==='entrada'&&!ehArquivado(c));}
function produtosArquivados(){return S.categorias.filter(c=>c.type==='entrada'&&ehArquivado(c));}
function usosDoProduto(id){return S.lancamentos.filter(l=>l.categoriaId===id||l.refCategoriaId===id).length;}
function tiposGasto(){return S.categorias.filter(c=>c.type==='saida'&&!ehCatCompra(c)&&!ehArquivado(c));}
function ehCatCompra(c){return c&&c.type==='saida'&&normalizeTxt(c.name)==='compra de estoque';}
function catCompraId(){const c=S.categorias.find(ehCatCompra);return c?c.id:null;}
async function garanteCatCompra(){
  const id=catCompraId();
  if(id)return id;
  const nova={id:novoId(),name:'Compra de Estoque',type:'saida',emoji:'📦',color:'#dc2626',preco:0,controlaEstoque:false,estoqueQtd:0,estoqueMin:0};
  await db.inserirCategoria(nova);
  S.categorias.push(nova);
  return nova.id;
}

function emSugHtml(q){
  const termo=(q||'').trim();
  let lista=produtos();
  if(termo!==''){
    lista=lista.map(c=>({c,score:fuzzyScore(termo,c.name)})).filter(x=>x.score!==Infinity)
      .sort((a,b)=>a.score-b.score).map(x=>x.c);
  }
  let html='';
  const jaExiste=produtos().some(c=>normalizeTxt(c.name)===normalizeTxt(termo));
  if(termo!==''&&!jaExiste){
    const sel=window._emNovo!==null&&window._emNovo!==undefined;
    html+=`<div class="cli-opt ${sel?'sel':''}" onclick="pickEmNovo()">
      <div class="item-ico" style="background:var(--blue-dim);width:30px;height:30px;font-size:.85rem">➕</div>
      <div style="flex:1"><div style="font-weight:700;font-size:.82rem">Criar novo produto: "${esc(termo)}"</div>
      <div style="font-size:.66rem;color:var(--text3);font-weight:600">Ainda não está cadastrado</div></div>
      ${sel?`<span style="color:var(--blue);font-weight:800">✓</span>`:''}
    </div>`;
  }
  if(lista.length===0&&html==='')return `<div class="empty" style="padding:14px"><div class="empty-txt">Digite o nome do produto</div></div>`;
  html+=lista.map(c=>`<div class="cli-opt ${window._emProd===c.id?'sel':''}" onclick="pickEmProduto('${c.id}')">
      <div class="item-ico" style="background:${c.color}18;width:30px;height:30px;font-size:.85rem">${c.emoji}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:.82rem">${esc(c.name)}</div>
      <div style="font-size:.66rem;color:var(--text3);font-weight:600">Tem ${c.estoqueQtd} un.</div></div>
      ${window._emProd===c.id?`<span style="color:var(--blue);font-weight:800">✓</span>`:''}
    </div>`).join('');
  return html;
}
function sugereEmProduto(){
  const q=document.getElementById('emBusca').value;

  document.getElementById('emSug').innerHTML=emSugHtml(q);

async function doEntradaMercadoria(){
  const qtd=parseInt(document.getElementById('emQtd').value)||0;
  const valor=parseFloat(document.getElementById('emValor').value)||0;
  const data=document.getElementById('emData').value||todayStr();
  const nomeNovo=(window._emNovo||'').trim();
  if(!window._emProd&&!nomeNovo){toast('Escolha ou crie o produto',true);return;}
  if(qtd<=0){toast('Digite a quantidade que chegou',true);return;}
  if(valor<0){toast('Valor inválido',true);return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){toast('Data inválida',true);return;}

  let prod=window._emProd?S.categorias.find(c=>c.id===window._emProd):null;
  let criado=null;
  const preco=parseFloat((document.getElementById('emPreco')||{}).value)||0;
  const estoqueAntes=prod?(prod.estoqueQtd||0):0;
  const now=new Date();
  const hora=pad(now.getHours())+':'+pad(now.getMinutes());

  try{
    setSyncBadge('busy');
    if(!prod){
      criado={id:novoId(),name:nomeNovo,type:'entrada',emoji:'🍷',color:COLORS[Math.floor(Math.random()*COLORS.length)],
        preco,controlaEstoque:true,estoqueQtd:0,estoqueMin:6};
      await db.inserirCategoria(criado);
      S.categorias.push(criado);
      prod=criado;
    }
    const compraId=await garanteCatCompra();
    prod.estoqueQtd=(prod.estoqueQtd||0)+qtd;
    const lanc={id:novoId(),type:'saida',categoriaId:compraId,valor,forma:window._forma||'dinheiro',hora,date:data,
      obs:qtd+' un. de '+prod.name,refCategoriaId:prod.id,qtdComprada:qtd,grupoId:novoId()};
    await db.inserirLancamento(lanc);
    await db.atualizarCategoria(prod);
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){
    setSyncBadge('err');
    if(prod&&!criado)prod.estoqueQtd=estoqueAntes;
    if(criado)S.categorias=S.categorias.filter(c=>c.id!==criado.id);
    toast('Erro ao salvar. Verifique a internet.',true);
    return;
  }
  const prodFinal=S.categorias.find(c=>c.id===prod.id)||prod;
  refreshAll();
  openModal(`
    <div class="mtitle" style="color:var(--green)">✅ Mercadoria adicionada</div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div class="item-ico" style="background:${prodFinal.color}18">${prodFinal.emoji}</div>
        <div style="flex:1;min-width:0">
          <div class="item-name">${esc(prodFinal.name)}${criado?` <span class="badge" style="background:var(--blue-dim);color:var(--blue)">novo</span>`:''}</div>
          <div class="item-meta">+${qtd} un. adicionadas</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--text2);padding-top:10px;border-top:1px solid var(--border)">
        <span>Estoque agora</span>
        <span style="font-family:'DM Mono',monospace;color:var(--text);font-weight:500">${prodFinal.estoqueQtd} un.</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--text2);margin-top:6px">
        <span>Gasto registrado</span>
        <span style="font-family:'DM Mono',monospace;color:var(--red);font-weight:500">${fmt(valor)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--text2);margin-top:6px">
        <span>Custo por unidade</span>
        <span style="font-family:'DM Mono',monospace;color:var(--text);font-weight:500">${fmt(valor/qtd)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--text2);margin-top:6px">
        <span>Data</span>
        <span style="font-weight:700;color:var(--text)">${new Date(data+'T00:00:00').toLocaleDateString('pt-BR')}</span>
      </div>
      ${prodFinal.preco>0?`<div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--text2);margin-top:6px">
        <span>Lucro previsto se vender tudo</span>
        <span style="font-family:'DM Mono',monospace;color:var(--green);font-weight:500">${fmt(prodFinal.preco*qtd-valor)}</span>
      </div>`:''}
    </div>
    <button class="btn-main" onclick="closeModal();openEntradaMercadoria()">➕ Adicionar outra</button>
    <button class="btn-ghost" onclick="closeModal()">Concluir</button>
  `);
}

async function doRemoverProduto(id){
  const c=S.categorias.find(x=>x.id===id);if(!c)return;
  const bkp=JSON.parse(JSON.stringify(c));
  setSyncBadge('busy');
  // Sem histórico: apaga de vez. Com histórico: arquiva (o banco não deixa apagar
  // uma categoria referenciada por lançamentos, e apagar quebraria o histórico).
  if(usosDoProduto(id)===0){
    try{
      await db.excluirCategoria(id);
      await recarregarSilencioso();
      setSyncBadge('ok');closeModal();renderEstoque();toast('Produto apagado');
      return;
    }catch(e){/* referenciado em algum lugar — arquiva abaixo */}
  }
  try{
    c.estoqueMin=-1;c.estoqueQtd=0;
    await db.atualizarCategoria(c);
    await recarregarSilencioso();
    setSyncBadge('ok');
  }catch(e){
    Object.assign(c,bkp);setSyncBadge('err');
    toast('Sem conexão. Tente de novo.',true);
    return;
  }
  closeModal();renderEstoque();toast('Produto removido');
}

function drillMonth(y,m){

    </div>`:''}
    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px">

    <div class="forma-grid">
      ${FORMAS.filter(f=>f.id!=='fiado').map((f,i)=>`<button onclick="selQuitarForma('${f.id}')" id="qf-${f.id}" class="forma-btn ${i===0?'sel':''}">${f.emoji} ${f.name}</button>`).join('')}
    </div>
    <label class="ilbl">Data do pagamento</label>

function setQuitarValor(v){const el=document.getElementById('qtVal');if(el)el.value=Number(v).toFixed(2);}
function selQuitarForma(id){
  FORMAS.filter(f=>f.id!=='fiado').forEach(f=>{const el=document.getElementById('qf-'+f.id);if(el)el.classList.toggle('sel',f.id===id);});
  window._quitarForma=id;
}
async function doQuitar(clienteId){
  const deve=fiadoDoCliente(clienteId);
  let valor=parseFloat(document.getElementById('qtVal').value)||0;
  if(valor<=0){toast('Digite um valor válido',true);return;}
  if(valor>deve+0.005){toast('Valor maior que a dívida de '+fmt(deve),true);return;}
  const now=new Date();
  const hora=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const dEl=document.getElementById('qtData');
  const dataPag=(dEl&&/^\d{4}-\d{2}-\d{2}$/.test(dEl.value))?dEl.value:todayStr();
  const pag={id:novoId(),clienteId,valor,forma:window._quitarForma||'dinheiro',date:dataPag,hora};
  try{setSyncBadge('busy');await db.inserirPagamento(pag);await recarregarSilencioso();setSyncBadge('ok');}
  catch(e){setSyncBadge('err');toast('Erro ao registrar pagamento',true);return;}
  closeModal();
  const restante=fiadoDoCliente(clienteId);
  toast(restante>0?('Pago '+fmt(valor)+' · restam '+fmt(restante)):'Dívida quitada!');
  refreshAll();
}
async function delPagamento(id){
  try{setSyncBadge('busy');await db.excluirPagamento(id);await recarregarSilencioso();setSyncBadge('ok');}
  catch(e){setSyncBadge('err');toast('Erro ao remover',true);return;}
  toast('Pagamento removido');
  refreshAll();
}

// ── EXPORTAR / IMPORTAR BACKUP ───────────────────────────────
const BACKUP_VERSAO=1;

function exportarDados(){
  try{
    const dados={
      _app:'fluxo-caixa-adega',
      _versao:BACKUP_VERSAO,
      _exportadoEm:new Date().toISOString(),
      categorias:S.categorias,
      clientes:S.clientes,
      lancamentos:S.lancamentos,
      pagamentos:S.pagamentos,
      theme:S.theme
    };
    const txt=JSON.stringify(dados,null,2);
    const d=new Date();
    const nome='backup-adega-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json';
    const blob=new Blob([txt],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=nome;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
    toast('Backup gerado!');
  }catch(e){
    toast('Não foi possível gerar o backup',true);
  }
}

function abrirImportar(){
  const inp=document.getElementById('fileImport');
  if(inp){inp.value='';inp.click();}
}

function lerArquivoImport(ev){
  const file=ev.target.files&&ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let dados=null;
    try{dados=JSON.parse(e.target.result);}
    catch(err){toast('Arquivo inválido',true);return;}
    validarEConfirmarImport(dados);
  };
  reader.onerror=function(){toast('Não foi possível ler o arquivo',true);};
  reader.readAsText(file);
}

function validarEConfirmarImport(dados){
  if(!dados||typeof dados!=='object'||!Array.isArray(dados.lancamentos)||!Array.isArray(dados.categorias)){
    toast('Este arquivo não é um backup do app',true);return;
  }
  const nLanc=dados.lancamentos.length;
  const nCli=Array.isArray(dados.clientes)?dados.clientes.length:0;
  const nPag=Array.isArray(dados.pagamentos)?dados.pagamentos.length:0;
  let quando='';
  if(dados._exportadoEm){
    const d=new Date(dados._exportadoEm);
    if(!isNaN(d.getTime()))quando=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  }
  window._importPend=dados;
  openModal(`
    <div class="mtitle">⬆️ Importar Backup</div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">
      ${quando?`<div style="font-size:.72rem;color:var(--text3);font-weight:700;margin-bottom:8px">Backup de ${quando}</div>`:''}
      <div style="font-size:.8rem;color:var(--text2);font-weight:600;line-height:1.6">
        📋 ${nLanc} lançamento${nLanc!==1?'s':''}<br>
        👤 ${nCli} cliente${nCli!==1?'s':''}<br>
        💵 ${nPag} pagamento${nPag!==1?'s':''} de fiado
      </div>
    </div>
    <p style="color:var(--red);font-size:.78rem;margin-bottom:16px;line-height:1.5;font-weight:600">
      ⚠️ Isso vai substituir tudo que está no aparelho agora (${S.lancamentos.length} lançamento${S.lancamentos.length!==1?'s':''}). Não há como desfazer.
    </p>
    <button class="btn-main" onclick="confirmarImport()">✅ Substituir pelos dados do backup</button>
    <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
  `);
}

async function confirmarImport(){
  const dados=window._importPend;
  if(!dados)return;
  window._importPend=null;
  // normaliza os dados do backup em memória primeiro
  let cats=Array.isArray(dados.categorias)?dados.categorias:[];
  let clis=Array.isArray(dados.clientes)?dados.clientes:[];
  let lans=Array.isArray(dados.lancamentos)?dados.lancamentos:[];
  let pags=Array.isArray(dados.pagamentos)?dados.pagamentos:[];
  cats.forEach(c=>{
    if(c.type==='entrada'){
      if(typeof c.preco!=='number')c.preco=0;
      c.controlaEstoque=true;
      c.estoqueQtd=Math.max(0,parseInt(c.estoqueQtd)||0);
      c.estoqueMin=Math.max(0,parseInt(c.estoqueMin)||0);
    }
  });
  lans.forEach(l=>{
    if(l.forma==='fiado'&&l.pago===true&&l.clienteId){
      const jaTem=pags.some(p=>p.origemLanc===l.id);
      const credito=pags.filter(p=>p.clienteId===l.clienteId).reduce((s,p)=>s+p.valor,0);
      const fiadoCli=lans.filter(x=>x.forma==='fiado'&&x.clienteId===l.clienteId).reduce((s,x)=>s+x.valor,0);
      if(!jaTem&&credito<fiadoCli)pags.push({id:novoId(),clienteId:l.clienteId,valor:Math.min(l.valor,fiadoCli-credito),forma:'dinheiro',date:l.dataPagamento||l.date,hora:l.hora||'12:00',origemLanc:l.id});
    }
    delete l.pago;delete l.dataPagamento;
  });
  // garante que todo registro tenha um id válido (uuid)
  const fixId=x=>{if(!x.id||!/^[0-9a-f-]{36}$/i.test(String(x.id)))x.id=novoId();};
  cats.forEach(fixId);clis.forEach(fixId);lans.forEach(fixId);pags.forEach(fixId);
  try{
    setSyncBadge('busy');
    closeModal();
    toast('Importando… não feche o app');
    // 1. limpa o que já existe na nuvem deste negócio
    for(const p of S.pagamentos)await db.excluirPagamento(p.id);
    for(const l of S.lancamentos)await db.excluirLancamento(l.id);
    for(const c of S.clientes)await db.excluirCliente(c.id);
    for(const c of S.categorias)await db.excluirCategoria(c.id);
    // 2. grava tudo do backup (ordem importa: categorias e clientes antes dos lançamentos)
    S.categorias=[];S.clientes=[];S.lancamentos=[];S.pagamentos=[];
    for(const c of cats){await db.inserirCategoria(c);S.categorias.push(c);}
    for(const c of clis){await db.inserirCliente(c);S.clientes.push(c);}
    for(const l of lans){await db.inserirLancamento(l);S.lancamentos.push(l);}
    for(const p of pags){await db.inserirPagamento(p);S.pagamentos.push(p);}
    if(dados.theme==='light'||dados.theme==='dark'){S.theme=dados.theme;save();}
    setSyncBadge('ok');applyTheme();
    setView('dash');
    toast('Backup importado com sucesso!');
  }catch(e){
    setSyncBadge('err');
    toast('Erro ao importar. Recarregue o app.',true);
  }
}

function confirmClear(){
  openModal(`
    <div class="mtitle" style="color:var(--red)">⚠️ Atenção</div>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:18px;line-height:1.5">Isso apaga os <b>${S.lancamentos.length}</b> lançamentos e os pagamentos de fiado, permanentemente. Produtos, clientes e as quantidades atuais de estoque continuam como estão. Não há como desfazer.</p>
    <button class="btn-danger" onclick="clearAll()">🗑️ Confirmar exclusão</button>
    <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
  `);
}
async function clearAll(){
  try{
    setSyncBadge('busy');closeModal();toast('Apagando…');
    for(const p of S.pagamentos)await db.excluirPagamento(p.id);
    for(const l of S.lancamentos)await db.excluirLancamento(l.id);
    S.lancamentos=[];S.pagamentos=[];CARRINHO=[];
    setSyncBadge('ok');renderConfig();toast('Lançamentos apagados');
  }catch(e){setSyncBadge('err');toast('Erro ao apagar. Recarregue o app.',true);}
}

const renders={dash:renderDash,lancar:renderLancar,clientes:renderClientes,estoque:renderEstoque,financeiro:renderFinanceiro,config:renderConfig};
// Inicialização: aplica tema e decide entre mostrar login ou entrar direto (se já logado)
applyTheme();
checkSessaoInicial();
</script>
